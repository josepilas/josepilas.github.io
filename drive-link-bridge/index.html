<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title></title>
  <style>html,body{display:none!important}</style>
</head>
<body>
<script>
(() => {
  'use strict';
  const q = new URLSearchParams(location.search);
  const rel = q.get('rel');
  const full = q.get('path');

  let protocolUrl = '';
  if (rel) {
    const normalized = rel.replace(/^[/\\]+/, '');
    if (/(^|[/\\])\.\.([/\\]|$)/.test(normalized)) {
      window.close();
      return;
    }
    protocolUrl = 'gdriveopen:?rel=' + encodeURIComponent(normalized);
  } else if (full) {
    protocolUrl = 'gdriveopen:?path=' + encodeURIComponent(full);
  } else {
    window.close();
    return;
  }

  location.href = protocolUrl;

  setTimeout(() => {
    try {
      window.open('', '_self');
      window.close();
    } catch (_) {}
  }, 900);

  setTimeout(() => {
    try { document.documentElement.innerHTML = ''; } catch (_) {}
  }, 1200);
})();
</script>
</body>
</html>
